<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tiermap Studio — an interactive entity and ownership structure diagramming tool."><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Tiermap Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen workbench. Inspector rail on the left, live structure canvas on the right; stacks (canvas first) on phones. */
:root{
  --paper:#F2F5F4; --panel:#FFFFFF; --ink:#16232A; --muted:#58686E; --line:#D2DBD9; --soft:#E8EEEC;
  --accent:#1D6A51; --accent-ink:#FFFFFF; --sel:#C4860F; --danger:#B3402E; --edge:#71838A; --dot:#C9D3D1;
  --c-company:#2D4C82; --f-company:#E6EDF8;
  --c-trust:#1D6A51;   --f-trust:#E1EFE8;
  --c-smsf:#7B3D6E;    --f-smsf:#F3E6F0;
  --c-individual:#46575D; --f-individual:#EEF2F2;
  --c-partnership:#946510; --f-partnership:#F7EEDB;
  --ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1619; --panel:#172126; --ink:#E2EAEC; --muted:#93A4A9; --line:#2B3A40; --soft:#1E2A2F;
  --accent:#4DB089; --accent-ink:#0B1A14; --sel:#E6AA38; --danger:#E0745F; --edge:#7F939A; --dot:#24323A;
  --c-company:#93B2EA; --f-company:#1B2940;
  --c-trust:#62C39B;   --f-trust:#153028;
  --c-smsf:#D59BC8;    --f-smsf:#33202E;
  --c-individual:#AAB9BE; --f-individual:#222D32;
  --c-partnership:#DCB060; --f-partnership:#352A16;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#0F1619; --panel:#172126; --ink:#E2EAEC; --muted:#93A4A9; --line:#2B3A40; --soft:#1E2A2F;
  --accent:#4DB089; --accent-ink:#0B1A14; --sel:#E6AA38; --danger:#E0745F; --edge:#7F939A; --dot:#24323A;
  --c-company:#93B2EA; --f-company:#1B2940;
  --c-trust:#62C39B;   --f-trust:#153028;
  --c-smsf:#D59BC8;    --f-smsf:#33202E;
  --c-individual:#AAB9BE; --f-individual:#222D32;
  --c-partnership:#DCB060; --f-partnership:#352A16;
  color-scheme:dark; }

[hidden]{display:none!important}
html{height:100%}
body{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:2px}
.grp{display:flex;align-items:center;gap:6px;min-width:0}
.grp label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp input{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font-weight:600;width:16em;max-width:52vw}
.grp input:hover,.grp input:focus{border-color:var(--line);background:var(--paper)}
.acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:13px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent)}

/* workbench */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,350px) 1fr}
.panel{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px}
.stage{position:relative;min-width:0;min-height:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#cv.grabbing{cursor:grabbing}

h2{font-size:17px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600;display:flex;justify-content:space-between}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.hint{color:var(--muted);font-size:13px;margin:0}
.sect{display:flex;flex-direction:column;gap:8px}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.elist button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;width:100%;padding:6px 8px;border-radius:5px;cursor:pointer}
.elist button:hover{background:var(--soft)}
.elist button:focus-visible{outline:2px solid var(--sel)}
.elist span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code,.mono{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;display:inline-block;border:1.5px solid}
.sw.t-company{background:var(--f-company);border-color:var(--c-company)}
.sw.t-partnership{background:var(--f-partnership);border-color:var(--c-partnership);border-radius:2px}
.sw.t-individual{background:var(--f-individual);border-color:var(--c-individual);border-radius:50%}
.sw.t-trust,.sw.t-smsf{border:0;width:12px;height:12px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sw.t-trust{background:var(--c-trust)} .sw.t-smsf{background:var(--c-smsf)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:7px 9px;width:100%;box-sizing:border-box}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:12px}
.msg.bad{color:var(--danger)} .msg.ok{color:var(--accent)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px}
.back:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.rels{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rels li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.rels li span{min-width:0}
.rels b{font-weight:600}
.x{all:unset;cursor:pointer;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.x:hover{color:var(--danger)}
.box{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.confirm{border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.confirm div{display:flex;gap:8px}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* canvas overlays */
.legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);max-width:calc(100% - 140px)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend svg{flex:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.zoom button{all:unset;cursor:pointer;width:34px;height:32px;display:grid;place-items:center;font-size:16px;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--soft)}
.sample{position:absolute;top:12px;left:12px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px}

/* svg */
.nm{font:600 13px var(--ui);fill:var(--ink)}
.sb{font:400 10.5px var(--mono);fill:var(--muted)}
.of{font:500 11px var(--ui);fill:var(--muted)}
.node{cursor:pointer}
.node .shape{stroke-width:1.6}
.t-company .shape{fill:var(--f-company);stroke:var(--c-company)}
.t-trust .shape{fill:var(--f-trust);stroke:var(--c-trust)}
.t-smsf .shape{fill:var(--f-smsf);stroke:var(--c-smsf)}
.t-individual .shape{fill:var(--f-individual);stroke:var(--c-individual)}
.t-partnership .shape{fill:var(--f-partnership);stroke:var(--c-partnership)}
.node.sel .shape{stroke:var(--sel);stroke-width:3}
.node.dim{opacity:.38}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.dash{stroke-dasharray:6 4}
.edge.dot{stroke-dasharray:1.5 4;stroke-linecap:round;stroke-width:1.8}
.edge.hot{stroke:var(--sel);stroke-width:2}
.edge.dim,.lbl.dim{opacity:.25}
.lbl rect{fill:var(--panel);stroke:var(--line)}
.lbl text{font:500 10.5px var(--mono);fill:var(--ink)}
.lbl.hot rect{stroke:var(--sel)}
.ah{fill:var(--edge)} .ah-hot{fill:var(--sel)}
.gridDot{fill:var(--dot)}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 38%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.mbody{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.results{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px}
.results li+li{border-top:1px solid var(--line)}
.results label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;cursor:pointer}
.results label:hover{background:var(--soft)}
.results input{accent-color:var(--accent)}
.results .nm2{font-weight:600}
.status{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.status.dereg{color:var(--danger)}
.xtype{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xtype label{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;gap:10px;cursor:pointer;align-items:flex-start}
.xtype label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
.xtype input{accent-color:var(--accent);margin-top:3px}
.xtype small{display:block;color:var(--muted)}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;background:var(--soft);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.ceased td{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.changes li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:13px}
.badge{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;text-align:center;min-width:64px}
.b-new{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.b-merge{background:color-mix(in srgb,var(--c-company) 16%,transparent);color:var(--c-company)}
.b-exists{background:var(--soft);color:var(--muted)}
.b-warn{background:color-mix(in srgb,var(--sel) 18%,transparent);color:var(--sel)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--muted)}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:760px){
  html,body{height:auto}
  .work{grid-template-columns:1fr}
  .stage{order:-1;height:64vh;border-bottom:1px solid var(--line)}
  .panel{border-right:0;overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .acts{margin-left:0}
  .legend{display:none}
  .cols,.xtype{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head><body>

<header class="bar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="7" y="1" width="8" height="6" rx="1" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M11 7v4M4 11h14M4 11v4M18 11v4" fill="none" stroke="var(--accent)" stroke-width="1.8"/><path d="M4 15l-3 5h6zM18 15l-3 5h6z" fill="var(--accent)"/></svg>

  <aside class="panel" id="panel"></aside>

    <svg id="cv" role="img" aria-label="Client structure diagram"></svg>

      <span><svg width="16" height="12"><rect x="1" y="1" width="14" height="10" rx="1.5" fill="var(--f-company)" stroke="var(--c-company)" stroke-width="1.5"/></svg>Company</span>
      <span><svg width="16" height="12"><path d="M8 1L15 11H1z" fill="var(--f-trust)" stroke="var(--c-trust)" stroke-width="1.5"/></svg>Trust</span>
      <span><svg width="16" height="12"><path d="M8 1L15 11H1z" fill="var(--f-smsf)" stroke="var(--c-smsf)" stroke-width="1.5"/></svg>SMSF</span>
      <span><svg width="16" height="12"><ellipse cx="8" cy="6" rx="7" ry="5" fill="var(--f-individual)" stroke="var(--c-individual)" stroke-width="1.5"/></svg>Individual</span>

</main>

<script>
(() => {
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'e' + Math.random().toString(36).slice(2, 9);
function svgEl(tag, attrs, parent){ const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }

/* ---------- ACN helpers (ASIC check-digit algorithm) ---------- */
const digits = s => String(s || '').replace(/\D/g, '');
function acnCheck(b8){ const w = [8,7,6,5,4,3,2,1]; let s = 0; for (let i = 0; i < 8; i++) s += +b8[i] * w[i]; return (10 - s % 10) % 10; }
const makeAcn = b8 => (b8 + acnCheck(b8)).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
const fmtAcn = a => { const d = digits(a); return d.length === 9 ? d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : a; };
const acnValid = a => { const d = digits(a); return d.length === 9 && acnCheck(d.slice(0, 8)) === +d[8]; };
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9& ]/g, ' ').replace(/\b(PTY|LTD|LIMITED|PROPRIETARY|THE)\b/g, ' ').replace(/\s+/g, ' ').trim();
const tc = s => s !== s.toUpperCase() ? s : s.toLowerCase().replace(/(^|[\s(\-/])([a-z])/g, (m, a, b) => a + b.toUpperCase());

/* ---------- model ---------- */
const TYPES = {
  individual:  { label:'Individual',  plural:'Individuals',  w:150, h:56 },
  company:     { label:'Company',     plural:'Companies',    w:188, h:62 },
  trust:       { label:'Trust',       plural:'Trusts',       w:206, h:92 },
  smsf:        { label:'SMSF',        plural:'SMSFs',        w:206, h:92 },
  partnership: { label:'Partnership', plural:'Partnerships', w:188, h:62 },
};
const ORDER = ['company','trust','smsf','partnership','individual'];
const ROLES = {
  shareholder: { label:'Shareholder', verb:'Holds shares in', to:['company'], style:'solid', qty:'shares' },
  unitholder:  { label:'Unitholder',  verb:'Holds units in', to:['trust'], style:'solid', qty:'shares' },
  member:      { label:'Member',      verb:'Member of', from:['individual'], to:['smsf'], style:'solid' },
  partner:     { label:'Partner',     verb:'Partner in', to:['partnership'], style:'solid', qty:'pct' },
  trustee:     { label:'Trustee',     verb:'Trustee of', from:['individual','company'], to:['trust','smsf'], style:'dash' },
  director:    { label:'Director',    verb:'Director of', from:['individual'], to:['company'], style:'dash', officer:true },
  secretary:   { label:'Secretary',   verb:'Secretary of', from:['individual'], to:['company'], style:'dash', officer:true },
  beneficiary: { label:'Beneficiary', verb:'Beneficiary of', to:['trust'], style:'dot' },
  appointor:   { label:'Appointor',   verb:'Appointor of', to:['trust'], style:'dot' },
};

const A = {

/* ---------- layout ---------- */
function visiblePairs(){
  const m = new Map();
  for (const l of state.links){
    if (!ent(l.from) || !ent(l.to)) continue;
    if (!ui.showOff && ROLES[l.role].officer) continue;
    const k = l.from + '>' + l.to;
    if (!m.has(k)) m.set(k, { from:l.from, to:l.to, links:[] });
    m.get(k).links.push(l);
  }
  const rank = { solid:0, dash:1, dot:2 };
  return [...m.values()].map(p => {
    p.links.sort((a, b) => rank[ROLES[a.role].style] - rank[ROLES[b.role].style]);
    p.style = ROLES[p.links[0].role].style;
    p.label = p.links.map(linkLabel).join(' · ');
    return p;
  });
}
function officerLines(e){
  if (ui.showOff || e.type !== 'company') return [];
  const short = n => { const p = n.split(' '); return p.length > 1 ? p[0][0] + ' ' + p.slice(1).join(' ') : n; };
  const by = r => state.links.filter(l => l.to === e.id && l.role === r && ent(l.from)).map(l => short(ent(l.from).name));
  const out = []; const d = by('director'), s = by('secretary');
  const fit = t => t.length > 30 ? t.slice(0, 29) + '…' : t;
  if (d.length) out.push(fit('Dir ' + d.join(', ')));
  if (s.length) out.push(fit('Sec ' + s.join(', ')));
  return out;
}
function geo(e){ const t = TYPES[e.type]; const n = officerLines(e).length; return { w:t.w, h:t.h + (n ? 8 + n * 13 : 0) }; }
const dims = id => geo(ent(id));

function layout(){
  const ids = state.entities.map(e => e.id);
  const pairs = visiblePairs();
  const adj = new Map(ids.map(i => [i, []]));
  pairs.forEach(p => adj.get(p.from).push(p));
  const st = {}, kept = [];
  const dfs = u => { st[u] = 1; for (const p of adj.get(u)){ if (st[p.to] === 1) continue; kept.push(p); if (!st[p.to]) dfs(p.to); } st[u] = 2; };
  ids.forEach(i => { if (!st[i]) dfs(i); });

  const kout = new Map(ids.map(i => [i, []])), kin = new Map(ids.map(i => [i, []]));
  const indeg = {}, L = {};
  ids.forEach(i => { indeg[i] = 0; L[i] = 0; });
  kept.forEach(p => { kout.get(p.from).push(p.to); kin.get(p.to).push(p.from); indeg[p.to]++; });
  const q = ids.filter(i => !indeg[i]);
  while (q.length){ const u = q.shift(); for (const v of kout.get(u)){ L[v] = Math.max(L[v], L[u] + 1); if (--indeg[v] === 0) q.push(v); } }
  ids.forEach(i => { if (!kin.get(i).length && kout.get(i).length) L[i] = Math.min(...kout.get(i).map(v => L[v])) - 1; });
  const minL = Math.min(0, ...Object.values(L));
  ids.forEach(i => L[i] -= minL);

  const maxL = Math.max(0, ...Object.values(L));
  const layers = Array.from({ length:maxL + 1 }, () => []);
  ids.forEach(i => layers[L[i]].push(i));
  const idx = {};
  const setIdx = () => layers.forEach(r => r.forEach((n, k) => idx[n] = k));
  setIdx();
  const bary = (n, nb) => { const ns = nb.get(n); return ns.length ? ns.reduce((a, v) => a + idx[v], 0) / ns.length : idx[n]; };
  const sortBy = (row, nb) => { const k = {}; row.forEach(n => k[n] = bary(n, nb)); row.sort((a, b) => k[a] - k[b]); };
  for (let it = 0; it < 6; it++){
    for (let l = 1; l <= maxL; l++){ sortBy(layers[l], kin); setIdx(); }
    for (let l = maxL - 1; l >= 0; l--){ sortBy(layers[l], kout); setIdx(); }
  }

  const GX = 46, GY = 104, pos = {};
  const place = (row, desired) => {
    const w = row.map(n => dims(n).w);
    const sp = k => (w[k - 1] + w[k]) / 2 + GX;
    const a = desired.slice(), b = desired.slice();
    for (let k = 1; k < row.length; k++) a[k] = Math.max(a[k], a[k - 1] + sp(k));
    for (let k = row.length - 2; k >= 0; k--) b[k] = Math.min(b[k], b[k + 1] - sp(k + 1));
    row.forEach((n, k) => pos[n].x = (a[k] + b[k]) / 2);
  };
  let y = 0;
  layers.forEach(row => {
    const h = Math.max(...row.map(n => dims(n).h));
    const w = row.map(n => dims(n).w);
    const total = w.reduce((s, v) => s + v, 0) + GX * (row.length - 1);
    let x = -total / 2;
    const packed = row.map((n, k) => { const c = x + w[k] / 2; x += w[k] + GX; return c; });
    row.forEach(n => pos[n] = { x:0, y:y + h / 2 });
    const desired = row.map((n, k) => { const ps = kin.get(n).filter(p => pos[p] && L[p] < L[n]); return ps.length ? ps.reduce((s, p) => s + pos[p].x, 0) / ps.length : packed[k]; });
    place(row, desired);
    y += h + GY;
  });
  for (let l = maxL - 1; l >= 0; l--){
    const row = layers[l];
    const desired = row.map(n => { const cs = kout.get(n).filter(c => L[c] > l); return cs.length ? cs.reduce((s, c) => s + pos[c].x, 0) / cs.length : pos[n].x; });
    place(row, desired);
  }
  ui.pos = pos;
}

const svg = $('#cv');
let gGrid, gEdges, gLabels, gNodes;
function initSvg(){
  svg.innerHTML = '';
  const defs = svgEl('defs', {}, svg);
  const pat = svgEl('pattern', { id:'dots', width:24, height:24, patternUnits:'userSpaceOnUse' }, defs);

  [['ah','ah'],['ahh','ah-hot']].forEach(([id, cls]) => {
    const m = svgEl('marker', { id, viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse' }, defs);
    svgEl('path', { d:'M0 1L10 5L0 9z', class:cls }, m);
  });
  gGrid = svgEl('rect', { x:-20000, y:-20000, width:40000, height:40000, fill:'url(#dots)' }, svg);
  gEdges = svgEl('g', {}, svg); gLabels = svgEl('g', {}, svg); gNodes = svgEl('g', {}, svg);
}
function wrap(text, max){
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words){ if ((cur + ' ' + w).trim().length <= max) cur = (cur + ' ' + w).trim(); else { if (cur) lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  if (lines.length > 2){ lines.length = 2; lines[1] = lines[1].slice(0, max - 1) + '…'; }
  return lines.map(l => l.length > max ? l.slice(0, max - 1) + '…' : l);
}
function edgeY(id, dx, side){ // side: 1 bottom, -1 top
  const e = ent(id), d = geo(e), p = ui.pos[id], hh = d.h / 2;
  if (e.type === 'individual'){ const a = d.w / 2; const r = Math.sqrt(Math.max(0, 1 - (dx / a) ** 2)); return p.y + side * hh * r; }
  if ((e.type === 'trust' || e.type === 'smsf') && side === -1) return p.y - hh + Math.abs(dx) * (d.h / (d.w / 2));
  return p.y + side * hh;
}
function spread(id, side){
  const t = ent(id).type, w = TYPES[t].w;
  if ((t === 'trust' || t === 'smsf') && side === -1) return w * 0.16;
  if (t === 'individual') return w * 0.42;
  return w * 0.56;
}
function render(){
  gEdges.innerHTML = ''; gLabels.innerHTML = ''; gNodes.innerHTML = '';
  const pairs = visiblePairs();
  const outs = {}, ins = {};
  pairs.forEach(p => { (outs[p.from] ??= []).push(p); (ins[p.to] ??= []).push(p); });
  const assign = (list, key, other, side) => {
    list.sort((a, b) => ui.pos[a[other]].x - ui.pos[b[other]].x);
    const n = list.length, s = spread(list[0][key], side);
    list.forEach((p, k) => p[side === 1 ? 'ox' : 'ix'] = n === 1 ? 0 : -s / 2 + s * k / (n - 1));
  };
  Object.values(outs).forEach(l => assign(l, 'from', 'to', 1));
  Object.values(ins).forEach(l => assign(l, 'to', 'from', -1));
  const sel = ui.sel, related = new Set();
  const placed = [];
  pairs.forEach(p => {
    const a = ui.pos[p.from], b = ui.pos[p.to];
    const sx = a.x + p.ox, sy = edgeY(p.from, p.ox, 1), tx = b.x + p.ix, ty = edgeY(p.to, p.ix, -1);
    const dy = Math.max(34, Math.abs(ty - sy) / 2);
    const hot = sel && (p.from === sel || p.to === sel);
    if (hot){ related.add(p.from); related.add(p.to); }
    const cls = 'edge ' + (p.style === 'solid' ? '' : p.style) + (hot ? ' hot' : sel ? ' dim' : '');
    svgEl('path', { d:`M${sx} ${sy}C${sx} ${sy + dy} ${tx} ${ty - dy} ${tx} ${ty}`, class:cls, 'marker-end':`url(#${hot ? 'ahh' : 'ah'})` }, gEdges);
    // label at curve midpoint, nudged off any label already placed
    const g = svgEl('g', { class:'lbl' + (hot ? ' hot' : sel ? ' dim' : '') }, gLabels);
    const t = svgEl('text', { 'text-anchor':'middle', 'dominant-baseline':'central' }, g);
    t.textContent = p.label;
    let w; try { w = t.getComputedTextLength() + 12; } catch(e){ w = p.label.length * 6.4 + 12; }
    if (!w || w < 14) w = p.label.length * 6.4 + 12;
    let mx = (sx + tx) / 2, my = (sy + ty) / 2;
    const hit = (x, y) => placed.some(r => Math.abs(r.x - x) < (r.w + w) / 2 + 2 && Math.abs(r.y - y) < 18);
    for (let k = 0; k < 6 && hit(mx, my); k++) my += (k % 2 ? -1 : 1) * 18 * (k + 1);
    placed.push({ x:mx, y:my, w });
    t.setAttribute('x', mx); t.setAttribute('y', my);
    svgEl('rect', { x:mx - w / 2, y:my - 9, width:w, height:18, rx:9 }, g).parentNode.insertBefore(g.lastChild, t);
  });
  state.entities.forEach(e => {
    const d = { ...TYPES[e.type], ...geo(e) }, p = ui.pos[e.id]; if (!p) return;
    const dim = sel && e.id !== sel && !related.has(e.id);
    const g = svgEl('g', { class:`node t-${e.type}${e.id === sel ? ' sel' : ''}${dim ? ' dim' : ''}`, transform:`translate(${p.x} ${p.y})`, 'data-id':e.id, tabindex:0, role:'button', 'aria-label':`${d.label}: ${e.name}` }, gNodes);
    const w = d.w, h = d.h;
    if (e.type === 'company') svgEl('rect', { x:-w/2, y:-h/2, width:w, height:h, rx:3, class:'shape' }, g);
    else if (e.type === 'individual') svgEl('ellipse', { rx:w/2, ry:h/2, class:'shape' }, g);
    else if (e.type === 'partnership'){ const c = 11, x = w/2, y = h/2; svgEl('polygon', { points:`${-x+c},${-y} ${x-c},${-y} ${x},${-y+c} ${x},${y-c} ${x-c},${y} ${-x+c},${y} ${-x},${y-c} ${-x},${-y+c}`, class:'shape' }, g); }
    else {
      svgEl('polygon', { points:`0,${-h/2} ${w/2},${h/2} ${-w/2},${h/2}`, class:'shape' }, g);
      if (e.type === 'smsf') svgEl('polygon', { points:`0,${-h/2 + 9} ${w/2 - 16},${h/2 - 5} ${-w/2 + 16},${h/2 - 5}`, class:'shape', fill:'none', 'stroke-width':1, opacity:.55 }, g);
    }
    const tri = e.type === 'trust' || e.type === 'smsf';
    const lines = wrap(e.name, tri ? 22 : e.type === 'individual' ? 17 : 22);
    const sub = e.type === 'company' && e.acn ? 'ACN ' + fmtAcn(e.acn) : e.type === 'individual' ? (e.dob ? 'DOB ' + fmtDate(e.dob) : '') : d.label.toUpperCase();
    const offs = officerLines(e);
    const lh = 15, block = lines.length * lh + (sub ? 14 : 0) + (offs.length ? 8 + offs.length * 13 : 0);
    let ty0 = tri ? h/2 - 12 - block + lh / 2 + 2 : -block / 2 + lh / 2 + 1;
    lines.forEach((ln, i) => { const t = svgEl('text', { class:'nm', 'text-anchor':'middle', 'dominant-baseline':'central', y:ty0 + i * lh }, g); t.textContent = ln; });
    if (sub){ const t = svgEl('text', { class:'sb', 'text-anchor':'middle', 'dominant-baseline':'central', y:ty0 + lines.length * lh + 1 }, g); t.textContent = sub; }
    if (offs.length){
      const y0 = ty0 + lines.length * lh + (sub ? 14 : 0) + 1;
      svgEl('line', { x1:-w/2 + 10, x2:w/2 - 10, y1:y0 - 4, y2:y0 - 4, class:'shape', 'stroke-width':.8, opacity:.45 }, g);
      offs.forEach((o, i) => { const t = svgEl('text', { class:'of', 'text-anchor':'middle', 'dominant-baseline':'central', y:y0 + 6 + i * 13 }, g); t.textContent = o; });
    }
  });
}

/* ---------- viewport ---------- */
function applyVB(){ const v = ui.vb; svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`); }
function fit(){
  const cw = svg.clientWidth || 800, ch = svg.clientHeight || 600;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  state.entities.forEach(e => { const p = ui.pos[e.id], d = geo(e); if (!p) return; x0 = Math.min(x0, p.x - d.w/2); x1 = Math.max(x1, p.x + d.w/2); y0 = Math.min(y0, p.y - d.h/2); y1 = Math.max(y1, p.y + d.h/2); });
  if (!isFinite(x0)){ x0 = -300; x1 = 300; y0 = -200; y1 = 200; }
  y1 += 44; // room for the legend
  const pad = 56; let bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
  bw = Math.max(bw, 520);
  const asp = cw / ch; let w, h;
  if (bw / bh < asp){ h = bh; w = bh * asp; } else { w = bw; h = bw / asp; }
  ui.vb = { x:(x0 + x1) / 2 - w / 2, y:(y0 + y1) / 2 - h / 2, w, h };
  applyVB();
}
function zoomAt(f, px, py){
  const v = ui.vb, cw = svg.clientWidth, ch = svg.clientHeight;
  const nw = Math.min(Math.max(v.w * f, 200), 12000), k = nw / v.w;
  const sx = v.x + (px / cw) * v.w, sy = v.y + (py / ch) * v.h;
  ui.vb = { x:sx - (px / cw) * nw, y:sy - (py / ch) * v.h * k, w:nw, h:v.h * k };
  applyVB();
}
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive:false });
let drag = null;
svg.addEventListener('pointerdown', e => {
  const g = e.target.closest('.node');
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
  drag = { id:g?.dataset.id, sx:e.clientX, sy:e.clientY, moved:false, vb:{ ...ui.vb }, p:g ? { ...ui.pos[g.dataset.id] } : null };
  if (!g) svg.classList.add('grabbing');
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = ui.vb.w / svg.clientWidth, dx = (e.clientX - drag.sx) * k, dy = (e.clientY - drag.sy) * k;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (drag.id){ ui.pos[drag.id] = { x:drag.p.x + dx, y:drag.p.y + dy }; render(); }
  else { ui.vb.x = drag.vb.x - dx; ui.vb.y = drag.vb.y - dy; applyVB(); }
});
const endDrag = () => {
  if (!drag) return;
  svg.classList.remove('grabbing');
  if (!drag.moved) select(drag.id || null);
  drag = null;
};
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', () => { drag = null; svg.classList.remove('grabbing'); });
svg.addEventListener('keydown', e => { const g = e.target.closest?.('.node'); if (g && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); select(g.dataset.id); } });
$('#z-in').onclick = () => zoomAt(0.8, svg.clientWidth / 2, svg.clientHeight / 2);
$('#z-out').onclick = () => zoomAt(1.25, svg.clientWidth / 2, svg.clientHeight / 2);
$('#z-fit').onclick = fit;
new ResizeObserver(() => { if (!ui.vb) return; const cw = svg.clientWidth, ch = svg.clientHeight; if (!cw || !ch) return; const cx = ui.vb.x + ui.vb.w / 2, cy = ui.vb.y + ui.vb.h / 2; ui.vb.h = ui.vb.w * ch / cw; ui.vb.y = cy - ui.vb.h / 2; ui.vb.x = cx - ui.vb.w / 2; applyVB(); }).observe(svg);

/* ---------- app actions ---------- */
function commit({ relayout = true, refit = false } = {}){
  save();
  if (relayout) layout();
  render();
  if (refit) fit();
  renderPanel();
}
function select(id){ ui.sel = id; ui.mode = id ? 'entity' : 'list'; ui.confirmDel = false; render(); renderPanel(); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

$('#g-name').value = state.group || '';
$('#g-name').addEventListener('change', e => { state.group = e.target.value.trim() || 'Untitled group'; save(); });
$('#t-off').addEventListener('change', e => { ui.showOff = e.target.checked; commit({ refit:true }); });
$('#b-relayout').onclick = () => { layout(); render(); fit(); toast('Diagram re-arranged'); };
$('#b-new').onclick = () => { ui.sel = null; ui.mode = 'add'; render(); renderPanel(); $('#f-name')?.focus(); };
$('#b-asic').onclick = () => openAsic();

/* ---------- panel ---------- */
const panel = $('#panel');
function renderPanel(){
  if (ui.mode === 'entity' && ent(ui.sel)) return panelEntity(ent(ui.sel));
  if (ui.mode === 'add') return panelAdd();
  panelList();
}
function panelList(){
  const n = state.entities.length, m = state.links.length;
  let h = `<div><h2>${esc(state.group)}</h2><p class="meta">${n} ${n === 1 ? 'entity' : 'entities'} · ${m} relationships</p></div>`;
  ORDER.forEach(t => {
    const es = state.entities.filter(e => e.type === t);
    if (!es.length) return;
    h += `<div class="sect"><h3>${TYPES[t].plural}<span>${es.length}</span></h3><ul class="elist">` +
      es.map(e => `<li><button data-sel="${e.id}"><i class="sw t-${t}"></i><span>${esc(e.name)}</span>${e.acn ? `<code>${esc(fmtAcn(e.acn))}</code>` : '<i></i>'}</button></li>`).join('') + '</ul></div>';
  });
  h += `<p class="hint">Select an entity on the diagram or in this list to edit it and its relationships. Drag a box to nudge it; Re-arrange lays the structure out again.</p>
    <button class="linkbtn" id="b-reset">Reset to the example group</button>`;
  panel.innerHTML = h;
  panel.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => select(b.dataset.sel));
  $('#b-reset').onclick = () => { state = example(); $('#g-name').value = state.group; ui.sel = null; commit({ refit:true }); toast('Example group restored'); };
}
function idFields(type, e = {}){
  if (type === 'company') return `<div class="field"><label for="f-acn">ACN</label><input id="f-acn" inputmode="numeric" placeholder="000 000 000" value="${esc(e.acn ? fmtAcn(e.acn) : '')}"><span class="msg" id="acn-msg"></span></div>`;
  if (type === 'individual') return `<div class="field"><label for="f-dob">Date of birth</label><input id="f-dob" type="date" value="${esc(e.dob || '')}"></div>`;
  return '';
}
function wireAcn(){
  const i = $('#f-acn'), m = $('#acn-msg'); if (!i) return;
  const chk = () => { const d = digits(i.value); if (!d){ m.textContent = ''; m.className = 'msg'; return; } if (d.length !== 9){ m.textContent = 'An ACN has 9 digits.'; m.className = 'msg bad'; } else if (!acnValid(d)){ m.textContent = 'Check digit doesn’t match. Recheck the number.'; m.className = 'msg bad'; } else { m.textContent = 'Valid ACN'; m.className = 'msg ok'; } };
  i.addEventListener('input', chk); chk();
}
function panelAdd(){
  panel.innerHTML = `<button class="back" id="bk">← All entities</button>
    <h2>Add an entity</h2>
    <div class="field"><label for="f-type">Type</label><select id="f-type">${ORDER.map(t => `<option value="${t}">${TYPES[t].label}</option>`).join('')}</select></div>
    <div class="field"><label for="f-name">Name</label><input id="f-name" placeholder="e.g. Harbourline Freight Pty Ltd"></div>
    <div id="f-id">${idFields('company')}</div>
    <div style="display:flex;gap:8px"><button class="btn pri" id="f-go">Add to diagram</button><button class="btn" id="f-cancel">Cancel</button></div>
    <p class="hint">Companies are faster to add with Pull ASIC extract. It brings in officeholders and shareholders too.</p>`;
  $('#bk').onclick = $('#f-cancel').onclick = () => select(null);
  $('#f-type').onchange = e => { $('#f-id').innerHTML = idFields(e.target.value); wireAcn(); };
  wireAcn();
  $('#f-go').onclick = () => {
    const name = $('#f-name').value.trim(); const type = $('#f-type').value;
    if (!name){ $('#f-name').focus(); toast('Give the entity a name first.'); return; }
    const e = { id:uid(), type, name };
    if ($('#f-acn')?.value) e.acn = fmtAcn($('#f-acn').value);
    if ($('#f-dob')?.value) e.dob = $('#f-dob').value;
    state.entities.push(e); ui.sel = e.id; ui.mode = 'entity';
    commit({ refit:true }); toast(`${name} added`);
  };
}
function panelEntity(e){
  const outL = state.links.filter(l => l.from === e.id && ent(l.to));
  const inL = state.links.filter(l => l.to === e.id && ent(l.from));
  const roles = Object.entries(ROLES).filter(([, r]) => !r.from || r.from.includes(e.type));
  const confirm = ui.confirmDel ? `<div class="confirm">Delete ${esc(e.name)} and its ${outL.length + inL.length} relationships?<div><button class="btn sm dng" id="d-yes">Delete</button><button class="btn sm" id="d-no">Keep</button></div></div>` : `<button class="btn dng" id="d-ask" style="align-self:flex-start">Delete entity</button>`;
  panel.innerHTML = `<button class="back" id="bk">← All entities</button>
    <div class="sect"><span class="chip"><i class="sw t-${e.type}"></i>${TYPES[e.type].label}</span>
      <div class="field"><label for="f-name">Name</label><input id="f-name" value="${esc(e.name)}"></div>
      ${idFields(e.type, e)}
    </div>
    <div class="sect"><h3>Relationships<span>${outL.length + inL.length}</span></h3>
      ${outL.length + inL.length ? `<ul class="rels">${outL.map(l => `<li><span>${linkSentence(l, true)}</span><button class="x" data-del="${l.id}" aria-label="Remove relationship">×</button></li>`).join('')}${inL.map(l => `<li><span>${linkSentence(l, false)}</span><button class="x" data-del="${l.id}" aria-label="Remove relationship">×</button></li>`).join('')}</ul>` : '<p class="hint">No relationships yet.</p>'}
    </div>
    <div class="box"><h3 style="margin:0">Add a relationship</h3>
      <div class="field"><label for="r-role">${esc(e.name)} is</label><select id="r-role">${roles.map(([k, r]) => `<option value="${k}">${r.verb}</option>`).join('')}</select></div>
      <div class="field"><label for="r-target">Entity</label><select id="r-target"></select></div>
      <div id="r-qty"></div>
      <button class="btn pri sm" id="r-go" style="align-self:flex-start">Add relationship</button>
    </div>
    ${confirm}`;
  $('#bk').onclick = () => select(null);
  $('#f-name').addEventListener('change', ev => { const v = ev.target.value.trim(); if (v){ e.name = v; commit({ relayout:false }); } });
  wireAcn();
  $('#f-acn')?.addEventListener('change', ev => { e.acn = ev.target.value.trim() ? fmtAcn(ev.target.value) : undefined; commit({ relayout:false }); });
  $('#f-dob')?.addEventListener('change', ev => { e.dob = ev.target.value || undefined; commit({ relayout:false }); });
  panel.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { state.links = state.links.filter(l => l.id !== b.dataset.del); commit(); toast('Relationship removed'); });
  const fillTargets = () => {
    const r = ROLES[$('#r-role').value];
    const opts = state.entities.filter(t => t.id !== e.id && r.to.includes(t.type));
    $('#r-target').innerHTML = opts.length ? opts.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('') : `<option value="">No ${r.to.map(t => TYPES[t].plural.toLowerCase()).join(' or ')} on the diagram</option>`;
    $('#r-go').disabled = !opts.length;
    $('#r-qty').innerHTML = r.qty === 'shares' ? `<div class="row2"><div class="field"><label for="r-shares">Number held</label><input id="r-shares" type="number" min="1" value="100"></div><div class="field"><label for="r-class">Class</label><input id="r-class" value="ORD"></div></div>`
      : r.qty === 'pct' ? `<div class="field"><label for="r-pct">Interest (%)</label><input id="r-pct" type="number" min="0" max="100" step="0.1" value="50"></div>` : '';
  };
  $('#r-role').onchange = fillTargets; fillTargets();
  $('#r-go').onclick = () => {
    const role = $('#r-role').value, to = $('#r-target').value; if (!to) return;
    if (state.links.some(l => l.from === e.id && l.to === to && l.role === role)){ toast('That relationship is already on the diagram.'); return; }
    const l = { id:uid(), from:e.id, to, role };
    if (ROLES[role].qty === 'shares'){ l.shares = Math.max(1, +$('#r-shares').value || 1); l.cls = ($('#r-class').value || 'ORD').toUpperCase(); }
    if (ROLES[role].qty === 'pct') l.pct = Math.min(100, Math.max(0, +$('#r-pct').value || 0));
    state.links.push(l); commit({ refit:true }); toast('Relationship added');
  };
  if (ui.confirmDel){
    $('#d-yes').onclick = () => { state.entities = state.entities.filter(x => x.id !== e.id); state.links = state.links.filter(l => l.from !== e.id && l.to !== e.id); ui.sel = null; ui.mode = 'list'; commit({ refit:true }); toast(`${e.name} deleted`); };
    $('#d-no').onclick = () => { ui.confirmDel = false; renderPanel(); };
  } else $('#d-ask').onclick = () => { ui.confirmDel = true; renderPanel(); };
}

/* ---------- ASIC extract flow ---------- */
const modal = $('#modal'), scrim = $('#scrim');
const asic = { step:'search', q:'', pick:null, kind:'current', plan:null };
function openAsic(){ Object.assign(asic, { step:'search', q:'', pick:null, kind:'current', plan:null }); scrim.hidden = false; drawAsic(); $('#a-q')?.focus(); }
function closeAsic(){ scrim.hidden = true; }
scrim.addEventListener('pointerdown', e => { if (e.target === scrim) closeAsic(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden) closeAsic(); });

function planImport(reg, historical){
  const ents = new Map(), links = [], notes = [];
  const findCo = (acn, name) => state.entities.find(e => e.type !== 'individual' && ((acn && digits(e.acn) === digits(acn)) || norm(e.name) === norm(name)));
  const findPerson = (name, dob) => {
    const c = state.entities.filter(e => e.type === 'individual' && norm(e.name) === norm(name));
    const exact = c.find(e => dob && e.dob === dob); if (exact) return { e:exact, how:'name and date of birth match' };
    const loose = c.find(e => !e.dob || !dob); if (loose) return { e:loose, how:'name matches; no date of birth to compare' };
    return null;
  };
  const co = (name, acn) => {
    const key = 'C:' + (digits(acn) || norm(name));
    if (!ents.has(key)){ const f = findCo(acn, name); ents.set(key, { key, type:'company', name:tc(name), acn:acn ? fmtAcn(acn) : undefined, existing:f?.id || null, existingName:f?.name, how:f ? (acn && digits(f.acn) === digits(acn) ? 'ACN matches' : 'name matches') : '' }); }
    return key;
  };
  const person = (name, dob) => {
    const key = 'P:' + norm(name);
    const cur = ents.get(key);
    if (!cur){ const f = findPerson(name, dob); ents.set(key, { key, type:'individual', name:tc(name), dob, existing:f?.e.id || null, existingName:f?.e.name, how:f?.how || '' }); }
    else if (dob && !cur.dob) cur.dob = dob;
    return key;
  };
  const subject = co(reg.name, reg.acn);
  const ceased = [];
  reg.officers.forEach(o => { if (o.ceased){ ceased.push(o); return; } links.push({ from:person(o.name, o.dob), to:subject, role:o.role }); });
  reg.shares.forEach(s => {
    let from = s.acn ? co(s.holder, s.acn) : person(s.holder);
    let via = null;
    if (!s.beneficial){
      const holderId = ents.get(from).existing;
      const tl = holderId && state.links.find(l => l.from === holderId && l.role === 'trustee' && ent(l.to)?.type === 'trust');
      if (tl){ const tr = ent(tl.to); const key = 'X:' + tr.id; ents.set(key, { key, type:'trust', name:tr.name, existing:tr.id, existingName:tr.name, how:'trust already on diagram', interposed:true }); via = { holder:tc(s.holder), trust:tr.name }; from = key; }
      else notes.push(`${tc(s.holder)} holds its ${s.cls} shares non-beneficially, but no trust it acts for is on the diagram. The shares are linked to ${tc(s.holder)} directly; add the trust and link it as trustee to interpose it.`);
    }
    links.push({ from, to:subject, role:'shareholder', shares:s.count, cls:s.cls, via });
  });
  links.forEach(l => {
    const f = ents.get(l.from).existing, t = ents.get(l.to).existing;
    const ex = f && t && state.links.find(x => x.from === f && x.to === t && x.role === l.role);
    l.status = !ex ? 'new' : (l.shares != null && (+ex.shares !== l.shares || (ex.cls || 'ORD') !== l.cls)) ? 'update' : 'exists';
  });
  return { ents:[...ents.values()], links, notes, ceased:historical ? ceased : [], ceasedHidden:historical ? 0 : ceased.length, subjectKey:subject };
}
function applyPlan(plan){
  const idMap = {}; let addE = 0, mergeE = 0, addL = 0, updL = 0;
  plan.ents.forEach(pe => {
    if (pe.existing){ const e = ent(pe.existing); if (pe.acn && !e.acn){ e.acn = pe.acn; } if (pe.dob && !e.dob) e.dob = pe.dob; idMap[pe.key] = e.id; if (!pe.interposed) mergeE++; }
    else { const id = uid(); state.entities.push({ id, type:pe.type, name:pe.name, acn:pe.acn, dob:pe.dob }); idMap[pe.key] = id; addE++; }
  });
  plan.links.forEach(pl => {
    const from = idMap[pl.from], to = idMap[pl.to];
    const ex = state.links.find(x => x.from === from && x.to === to && x.role === pl.role);
    if (ex){ if (pl.status === 'update'){ ex.shares = pl.shares; ex.cls = pl.cls; updL++; } return; }
    const l = { id:uid(), from, to, role:pl.role }; if (pl.shares != null){ l.shares = pl.shares; l.cls = pl.cls; }
    state.links.push(l); addL++;
  });
  return { addE, mergeE, addL, updL };
}
function drawAsic(){
  const head = (t, p) => `<div class="mhead"><div><h2 id="m-title">${t}</h2><p>${p}</p></div><button class="x" id="m-x" aria-label="Close" style="font-size:22px">×</button></div>`;
  if (asic.step === 'search'){
    const q = norm(asic.q), qd = digits(asic.q);
    const hits = REGISTER.filter(r => !asic.q || (qd.length >= 3 && digits(r.acn).includes(qd)) || norm(r.name).includes(q));
    modal.innerHTML = head('Pull an ASIC extract', 'Search the register by company name or ACN, then choose the extract you need.') + `
      <div class="mbody">
        <div class="field"><label for="a-q">Company name or ACN</label><input id="a-q" placeholder="e.g. Harbourline or ${esc(A.harbour)}" value="${esc(asic.q)}" autocomplete="off"></div>
        ${hits.length ? `<ul class="results">${hits.map(r => `<li><label><input type="radio" name="a-pick" value="${r.acn}" ${asic.pick === r.acn ? 'checked' : ''}><span><span class="nm2">${esc(tc(r.name))}</span><br><code>ACN ${esc(r.acn)}</code></span><span class="status">${esc(r.status)}</span></label></li>`).join('')}</ul>` : `<p class="hint">No companies match “${esc(asic.q)}”. Check the spelling, or search by the 9-digit ACN.</p>`}
        <div class="xtype">
          <label><input type="radio" name="a-kind" value="current" ${asic.kind === 'current' ? 'checked' : ''}><span><b>Current extract</b> <span class="price">A$${PRICE.current.toFixed(2)}</span><small>Current officeholders and shareholdings</small></span></label>
          <label><input type="radio" name="a-kind" value="historical" ${asic.kind === 'historical' ? 'checked' : ''}><span><b>Current and historical</b> <span class="price">A$${PRICE.historical.toFixed(2)}</span><small>Adds ceased officeholders and past changes</small></span></label>
        </div>
        <p class="hint">Prototype: this searches a sample register of fictional companies. Nothing is charged.</p>
      </div>
      <div class="mfoot"><span class="hint">Charged to the card on your account, inc. GST</span><div style="display:flex;gap:8px"><button class="btn" id="a-cancel">Cancel</button><button class="btn pri" id="a-go" ${asic.pick ? '' : 'disabled'}>Pull extract</button></div></div>`;
    const qi = $('#a-q');
    qi.addEventListener('input', e => { asic.q = e.target.value; const pos = e.target.selectionStart; drawAsic(); const n = $('#a-q'); n.focus(); n.setSelectionRange(pos, pos); });
    modal.querySelectorAll('[name=a-pick]').forEach(r => r.onchange = () => { asic.pick = r.value; $('#a-go').disabled = false; });
    modal.querySelectorAll('[name=a-kind]').forEach(r => r.onchange = () => asic.kind = r.value);
    $('#a-cancel').onclick = closeAsic;
    $('#a-go').onclick = () => { asic.step = 'loading'; drawAsic(); setTimeout(() => { const reg = REGISTER.find(r => r.acn === asic.pick); asic.plan = planImport(reg, asic.kind === 'historical'); asic.step = 'review'; drawAsic(); }, 900); };
  } else if (asic.step === 'loading'){
    modal.innerHTML = head('Pull an ASIC extract', 'Requesting the extract.') + `<div class="mbody"><div class="loading"><div class="spin"></div>Requesting the extract from the information broker…</div></div>`;
  } else {
    const reg = REGISTER.find(r => r.acn === asic.pick), plan = asic.plan;
    const shareTot = {}; reg.shares.forEach(s => shareTot[s.cls] = (shareTot[s.cls] || 0) + s.count);
    const role = r => r === 'director' ? 'Director' : 'Secretary';
    const offRows = reg.officers.filter(o => !o.ceased || asic.kind === 'historical').map(o => `<tr class="${o.ceased ? 'ceased' : ''}"><td>${esc(tc(o.name))}</td><td>${role(o.role)}</td><td class="num">${fmtDate(o.dob)}</td><td class="num">${fmtDate(o.appointed)}${o.ceased ? ' – ' + fmtDate(o.ceased) : ''}</td></tr>`).join('');
    const shRows = reg.shares.map(s => `<tr><td>${esc(tc(s.holder))}${s.acn ? `<br><code>ACN ${esc(s.acn)}</code>` : ''}</td><td>${esc(s.cls)}</td><td class="num">${s.count.toLocaleString('en-AU')}</td><td class="num">${pctStr(s.count / shareTot[s.cls] * 100)}%</td><td>${s.beneficial ? 'Yes' : '<b>No</b>'}</td></tr>`).join('');
    const nm = k => esc(plan.ents.find(e => e.key === k).name);
    const entItems = plan.ents.filter(e => !e.interposed).map(e => e.existing
      ? `<li><span class="badge b-merge">Merge</span><span>${esc(e.name)} into <b>${esc(e.existingName)}</b> on the diagram (${esc(e.how)})${e.how.includes('no date') ? ' — check this is the same person' : ''}</span></li>`
      : `<li><span class="badge b-new">New</span><span>${esc(e.name)} · ${TYPES[e.type].label.toLowerCase()}${e.acn ? ` · ACN ${esc(e.acn)}` : ''}${e.dob ? ` · born ${fmtDate(e.dob)}` : ''}</span></li>`).join('');
    const linkItems = plan.links.map(l => {
      const b = l.status === 'new' ? '<span class="badge b-new">New</span>' : l.status === 'update' ? '<span class="badge b-warn">Update</span>' : '<span class="badge b-exists">On diagram</span>';
      const what = l.role === 'shareholder' ? `${nm(l.from)} holds ${l.shares.toLocaleString('en-AU')} ${esc(l.cls)} in ${nm(l.to)}${l.via ? ` <i>(held by ${esc(l.via.holder)} as trustee; interposed through the trust)</i>` : ''}` : `${nm(l.from)} is ${l.role} of ${nm(l.to)}`;
      return `<li>${b}<span>${what}</span></li>`;
    }).join('');
    const nNew = plan.links.filter(l => l.status !== 'exists').length + plan.ents.filter(e => !e.existing).length;
    modal.innerHTML = head(esc(tc(reg.name)), `ACN ${esc(reg.acn)} · ${asic.kind === 'historical' ? 'Current and historical' : 'Current'} extract · A$${PRICE[asic.kind].toFixed(2)}`) + `
      <div class="mbody">
        <dl class="kv"><dt>Status</dt><dd><span class="status">${esc(reg.status)}</span></dd><dt>Type</dt><dd>${esc(reg.kind)}</dd><dt>Registered</dt><dd>${fmtDate(reg.registered)}</dd><dt>Registered office</dt><dd>${esc(reg.address)}</dd></dl>
        <div><h3>Officeholders</h3><div class="tblwrap"><table><thead><tr><th>Name</th><th>Role</th><th>Born</th><th>Appointed</th></tr></thead><tbody>${offRows}</tbody></table></div>
        ${plan.ceasedHidden ? `<p class="hint" style="margin-top:6px">${plan.ceasedHidden} former officeholder${plan.ceasedHidden > 1 ? 's are' : ' is'} only shown on a historical extract.</p>` : asic.kind === 'historical' && plan.ceased.length ? '<p class="hint" style="margin-top:6px">Ceased officeholders are shown for reference and aren’t added to the diagram.</p>' : ''}</div>
        <div><h3>Shareholdings</h3><div class="tblwrap"><table><thead><tr><th>Holder</th><th>Class</th><th>Number</th><th>Of class</th><th>Beneficial</th></tr></thead><tbody>${shRows}</tbody></table></div></div>
        <div class="cols">
          <div><h3>Entities</h3><ul class="changes">${entItems}</ul></div>
          <div><h3>Relationships</h3><ul class="changes">${linkItems}</ul></div>
        </div>
        ${plan.notes.map(n => `<p class="hint"><span class="badge b-warn">Check</span> ${esc(n)}</p>`).join('')}
      </div>
      <div class="mfoot"><button class="btn" id="a-back">Back to search</button><button class="btn pri" id="a-apply" ${nNew ? '' : 'disabled'}>${nNew ? 'Add to diagram' : 'Already up to date'}</button></div>`;
    $('#a-back').onclick = () => { asic.step = 'search'; drawAsic(); };
    $('#a-apply').onclick = () => {
      const r = applyPlan(plan); closeAsic();
      const subj = state.entities.find(e => digits(e.acn) === digits(reg.acn));
      ui.sel = subj?.id || null; ui.mode = ui.sel ? 'entity' : 'list';
      commit({ refit:true });
